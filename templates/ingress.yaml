apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.globalStaticIpName }}
    networking.gke.io/managed-certificates: {{ .Values.managedCertificates }}
    networking.gke.io/v1beta1.FrontendConfig: {{ .Values.frontendConfig }}
  labels:
    service: n8n
spec:
  defaultBackend:
    service:
      name: n8n
      port:
        number: 5678
  # Variables to pass via helm
