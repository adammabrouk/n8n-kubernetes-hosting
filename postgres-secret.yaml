apiVersion: v1
kind: Secret
metadata:
  namespace: n8n
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresAdminUser }}
  POSTGRES_PASSWORD: {{ .Values.postgresAdminPassword }}
  POSTGRES_DB: n8n
  POSTGRES_NON_ROOT_USER: {{ .Values.postgresNonRootUser }}
  POSTGRES_NON_ROOT_PASSWORD: {{ .Values.postgresNonRootPassword }}
  # Variables to pass via helm
